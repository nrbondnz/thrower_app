version: 1
# Website only: no backend phase, so this branch never deploys the app's
# Amplify backend (that lives on main, in the thrower_app Amplify app).
frontend:
  phases:
    preBuild:
      commands:
        # Astro 7 needs Node >= 22.22; the build image's Node 22 may be older.
        - nvm install 22
        - nvm use 22
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
